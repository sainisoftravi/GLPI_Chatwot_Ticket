# =========================================================================
# Production Nginx Configuration
# Replace yourdomain.com with your actual registered domain
# =========================================================================

server {
    listen 80;
    server_name support.yourdomain.com it.yourdomain.com;
    return 301 https://$host$request_uri;
}

# 1. Chatwoot & WhatsApp Portal
server {
    listen 443 ssl http2;
    server_name support.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/support.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.yourdomain.com/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Chatwoot real-time events
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. GLPI ITSM Portal
server {
    listen 443 ssl http2;
    server_name it.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/it.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it.yourdomain.com/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
