name: Deploy to Self-Hosted ARM64 Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/ubuntu/Ticket_Managment_System_Webserver

jobs:
  deploy:
    name: Build & Deploy to Target Path (ARM64)
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      - name: Sync Code to Target Directory
        run: |
          echo "Ensuring deployment directory exists: $DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          
          echo "Syncing repository files to $DEPLOY_DIR..."
          # Sync all files except .git and preserve server's existing .env if already present
          rsync -av --exclude='.git' --exclude='.env' ./ "$DEPLOY_DIR/"

      - name: Preserve & Validate Server Environment File (.env)
        working-directory: /home/ubuntu/Ticket_Managment_System_Webserver
        run: |
          echo "Checking .env in $DEPLOY_DIR..."
          if [ ! -f .env ]; then
            echo "No .env file found. Creating initial .env from .env.example..."
            cp .env.example .env
          else
            echo "✅ Existing server .env found. Preserving your server configuration."
          fi

      - name: Verify Docker & Compose
        working-directory: /home/ubuntu/Ticket_Managment_System_Webserver
        run: |
          docker --version
          docker compose version

      - name: Prepare Chatwoot Database Migrations
        working-directory: /home/ubuntu/Ticket_Managment_System_Webserver
        run: |
          echo "Checking/preparing Chatwoot database schema..."
          docker compose run --rm chatwoot-web bundle exec rails db:chatwoot_prepare || true

      - name: Build & Launch Containers
        working-directory: /home/ubuntu/Ticket_Managment_System_Webserver
        run: |
          echo "Deploying containers from $DEPLOY_DIR..."
          docker compose up -d --build --remove-orphans

      - name: Healthcheck Verification
        working-directory: /home/ubuntu/Ticket_Managment_System_Webserver
        run: |
          echo "Waiting 15 seconds for services to initialize..."
          sleep 15
          
          echo "Checking running container statuses:"
          docker compose ps
          
          echo "Verifying Bridge Health Endpoint..."
          if curl -f -s http://localhost:5050/health; then
            echo ""
            echo " Bridge service is healthy and active!"
          else
            echo " Bridge healthcheck returned non-200 or is still starting."
          fi

      - name: Prune Dangling Docker Images
        run: |
          echo "Cleaning up dangling images to preserve ARM64 storage..."
          docker image prune -f
